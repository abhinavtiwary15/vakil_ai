name: vakilai
description: VakilAI - AI-powered legal assistant for Indian MSMEs
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Firebase
  firebase_core: ^2.27.1
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.9
  firebase_messaging: ^14.7.19

  # HTTP
  dio: ^5.4.3+1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.0.0

  # PDF
  pdf: ^3.11.0
  printing: ^5.12.0
  flutter_pdfview: ^1.3.2

  # File Handling
  file_picker: ^8.0.2
  image_picker: ^1.1.1
  flutter_image_compress: ^2.3.0

  # Notifications
  flutter_local_notifications: ^17.1.2

  # Localization
  intl: ^0.20.2

  # Payments
  razorpay_flutter: ^1.3.6

  # Charts
  fl_chart: ^0.67.0

  # OCR & Camera
  camera: ^0.10.5+9
  google_mlkit_text_recognition: ^0.13.0

  # Animations
  lottie: ^3.1.0

  # UI
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.3
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  tutorial_coach_mark: ^1.2.11
  flutter_animate: ^4.5.0
  pinput: ^5.0.0

  # Speech
  speech_to_text: ^6.6.1
  flutter_tts: ^4.0.2

  # Utils
  uuid: ^4.4.0
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1
  image_cropper: ^7.0.3
  open_file: ^3.3.2
  encrypt: ^5.0.3
  crypto: ^3.0.3
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  timeago: ^3.6.1
  shimmer_animation: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/

